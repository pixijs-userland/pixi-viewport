name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: ⏬ Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ✨ Lint
        run: pnpm run lint
      - name: 🧪 Test
        run: pnpm run test
      - name: 🦾 Build Lib
        run: pnpm run build
