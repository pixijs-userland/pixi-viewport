name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'
      - name: ⏬ Install dependencies
        run: yarn install --frozen-lockfile
      - name: ✨ Lint
        run: yarn lint
      - name: 🧪 Test
        run: yarn test
      - name: 🦾 Build Lib
        run: yarn build
