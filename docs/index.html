<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>pixi-viewport playground</title>
    <meta name="description" content="Try every pixi-viewport plugin: drag, pinch, wheel zoom, decelerate, clamp, bounce, edge scrolling, follow, snap, and animate.">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="./">pixi-viewport <span class="version" data-version></span></a>
        <nav aria-label="Site">
            <a href="./" aria-current="page">Playground</a>
            <a href="./examples/scrolling-page.html">In a scrolling page</a>
            <a href="./examples/overlays.html">Overlays</a>
            <a href="./api/">API</a>
            <a href="https://github.com/pixijs-userland/pixi-viewport">GitHub</a>
        </nav>
    </header>

    <main class="stage" aria-label="Interactive viewport demo"></main>

    <div class="panel hud" aria-live="off"></div>
    <div class="panel hint" role="status"></div>

    <details class="panel code-panel" open>
        <summary>Code for this setup <button class="copy-button" type="button">Copy</button></summary>
        <pre><code></code></pre>
    </details>

    <details class="panel event-panel" open>
        <summary>Events</summary>
        <ol></ol>
    </details>

    <script type="module" src="./src/playground/main.ts"></script>
</body>
</html>
